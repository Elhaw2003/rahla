org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Keep legacy AGP DSL until Flutter fully migrates
android.newDsl=false
# Firebase plugins still apply the legacy Kotlin Android plugin
android.builtInKotlin=false
# Project is on D: and Pub cache on C:; Kotlin incremental caches fail across drive roots on Windows
kotlin.incremental=false
